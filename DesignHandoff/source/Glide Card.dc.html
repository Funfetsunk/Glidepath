<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  @keyframes gc_drawLine { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  @keyframes gc_fadeArea { from { opacity: 0; } to { opacity: 1; } }
  @keyframes gc_glide62 { from { offset-distance: 0%; opacity: 0; } 15% { opacity: 1; } to { offset-distance: 62%; opacity: 1; } }
</style>
</helmet>

<div style="{{ theme }}">
  <div style="width:344px; height:724px; border-radius:44px; border:11px solid var(--bezel); background:var(--bg); overflow:hidden; display:flex; flex-direction:column; box-shadow:0 40px 90px rgba(20,15,5,0.28); font-family:'Hanken Grotesk',system-ui,sans-serif;">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:11px 22px 5px; color:var(--text); font-size:13px; font-weight:600;">
      <span style="font-family:'Space Mono',monospace;">9:30</span>
      <div style="display:flex; gap:6px; align-items:center; opacity:.85;">
        <span style="width:16px; height:9px; border:1.5px solid var(--text); border-radius:2px; display:inline-block;"></span>
        <span style="width:15px; height:9px; background:var(--text); border-radius:2px; display:inline-block;"></span>
      </div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; padding:14px 22px 0;">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:24px;">
        <div>
          <div style="font-size:19px; font-weight:700; color:var(--text); line-height:1.1;">Visa card</div>
          <div style="font-size:13px; color:var(--mut); margin-top:2px;">Paying down</div>
        </div>
        <span style="flex:1;"></span>
        <span style="font-size:11px; font-weight:600; color:var(--accent); background:var(--accentSoft); padding:5px 11px; border-radius:99px;">DEBT</span>
      </div>

      <div style="text-align:center; margin-bottom:6px;">
        <div style="font-family:'Space Mono',monospace; font-weight:700; font-size:52px; letter-spacing:-2px; color:var(--text); line-height:1;">
          <span style="font-size:30px; color:var(--accent); vertical-align:top; margin-right:2px;">£</span>{{ disp }}
        </div>
        <div style="font-size:14px; color:var(--mut); margin-top:8px;">altitude · £8,500 to touchdown</div>
      </div>

      <div style="margin:28px 2px 4px;">
        <div style="position:relative; width:300px; height:150px; margin:0 auto;">
          <svg width="300" height="150" viewBox="0 0 300 150" style="position:absolute; inset:0; overflow:visible;">
            <path d="M6,22 C120,30 190,92 294,128 L294,150 L6,150 Z" fill="var(--accentSoft)" style="animation:gc_fadeArea 900ms 300ms both;"></path>
            <path d="M6,22 C120,30 190,92 294,128" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="100" style="animation:gc_drawLine 1100ms cubic-bezier(.4,0,.2,1) both;"></path>
            <line x1="6" y1="128" x2="294" y2="128" stroke="var(--track2)" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.6"></line>
          </svg>
          <div style="position:absolute; top:0; left:0; width:8px; height:8px; border-radius:99px; background:var(--accent); offset-path:path('M6,22 C120,30 190,92 294,128'); offset-distance:25%; offset-rotate:0;"></div>
          <div style="position:absolute; top:0; left:0; width:8px; height:8px; border-radius:99px; background:var(--accent); offset-path:path('M6,22 C120,30 190,92 294,128'); offset-distance:50%; offset-rotate:0;"></div>
          <div style="position:absolute; top:0; left:0; width:8px; height:8px; border-radius:99px; background:var(--track2); offset-path:path('M6,22 C120,30 190,92 294,128'); offset-distance:75%; offset-rotate:0;"></div>
          <div style="position:absolute; top:0; left:0; width:11px; height:11px; border-radius:3px; background:var(--track2); offset-path:path('M6,22 C120,30 190,92 294,128'); offset-distance:100%; offset-rotate:0;"></div>
          <div style="position:absolute; top:0; left:0; width:0; height:0; border-left:13px solid var(--accent); border-top:7px solid transparent; border-bottom:7px solid transparent; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.35)); offset-path:path('M6,22 C120,30 190,92 294,128'); offset-rotate:auto; animation:gc_glide62 1300ms 250ms both;"></div>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--mut); margin-top:8px;">
          <span style="font-family:'Space Mono',monospace;">Start</span>
          <span style="font-family:'Space Mono',monospace; color:var(--accent);">62% down</span>
          <span style="font-family:'Space Mono',monospace;">Touchdown · £0</span>
        </div>
      </div>

      <div style="display:flex; gap:10px; margin-top:22px;">
        <div style="flex:1; background:var(--surf); border-radius:16px; padding:14px;">
          <div style="font-size:12px; color:var(--mut);">Paid so far</div>
          <div style="font-family:'Space Mono',monospace; font-size:19px; font-weight:700; color:var(--text); margin-top:4px;">£5,260</div>
        </div>
        <div style="flex:1; background:var(--surf); border-radius:16px; padding:14px;">
          <div style="font-size:12px; color:var(--mut);">Debt-free</div>
          <div style="font-family:'Space Mono',monospace; font-size:19px; font-weight:700; color:var(--text); margin-top:4px;">Feb 2027</div>
        </div>
      </div>

      <span style="flex:1;"></span>
      <div style="display:flex; align-items:center; justify-content:center; gap:9px; background:var(--accent); color:var(--onAccent); border-radius:18px; padding:16px; font-weight:700; font-size:16px; margin-bottom:12px;">
        <span style="font-size:20px; line-height:1;">+</span> Log a payment
      </div>
    </div>
    <div style="display:flex; justify-content:space-around; padding:8px 0 6px; border-top:1px solid var(--line);">
      <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><span style="width:20px; height:20px; border-radius:6px; background:var(--accent);"></span><span style="font-size:11px; color:var(--accent); font-weight:600;">Home</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><span style="width:20px; height:20px; border-radius:6px; background:var(--mut); opacity:.4;"></span><span style="font-size:11px; color:var(--mut);">History</span></div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:4px;"><span style="width:20px; height:20px; border-radius:6px; background:var(--mut); opacity:.4;"></span><span style="font-size:11px; color:var(--mut);">Settings</span></div>
    </div>
    <div style="display:flex; justify-content:center; padding:6px 0 10px;"><span style="width:110px; height:4px; border-radius:99px; background:var(--text); opacity:.35;"></span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:366,&quot;height&quot;:746},&quot;theme&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string,string&gt;&quot;},&quot;target&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3240}}">
class Component extends DCLogic {
  state = { disp: 0 };
  componentDidMount() {
    const target = this.props.target ?? 3240, dur = 1100, start = performance.now();
    const tick = (t) => {
      let p = Math.min(1, (t - start) / dur);
      p = 1 - Math.pow(1 - p, 3);
      this.setState({ disp: Math.round(target * p) });
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  renderVals() {
    const fallback = { '--bg':'#0d201b','--surf':'#16302a','--line':'#274b42','--text':'#eef4f1','--mut':'#93b0a6','--accent':'#e6b455','--onAccent':'#1c2b12','--track':'#26463d','--track2':'#3a5b52','--accentSoft':'rgba(230,180,85,0.16)','--bezel':'#050f0c' };
    return { theme: this.props.theme ?? fallback, disp: this.state.disp.toLocaleString('en-GB') };
  }
}
</script>
</body>
</html>
